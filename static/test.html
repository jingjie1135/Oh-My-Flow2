<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flow2API 模型测试</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f1117; color: #e1e1e6; min-height: 100vh; }
.container { max-width: 1200px; margin: 0 auto; padding: 20px; }
h1 { text-align: center; margin-bottom: 8px; font-size: 24px; color: #7c8aff; }
.subtitle { text-align: center; color: #666; margin-bottom: 24px; font-size: 14px; }

.config-bar {
  display: flex; gap: 12px; margin-bottom: 20px; align-items: center;
  background: #1a1b26; padding: 12px 16px; border-radius: 10px; border: 1px solid #2a2b3a;
}
.config-bar label { font-size: 13px; color: #888; white-space: nowrap; }
.config-bar input { flex: 1; background: #0f1117; border: 1px solid #2a2b3a; color: #e1e1e6; padding: 8px 12px; border-radius: 6px; font-size: 14px; }
.config-note { margin-bottom: 20px; font-size: 12px; color: #7f8498; }

.main-layout { display: flex; gap: 20px; }
.sidebar { width: 280px; flex-shrink: 0; }
.content { flex: 1; min-width: 0; }

.model-section { margin-bottom: 16px; }
.section-title {
  font-size: 13px; font-weight: 600; color: #7c8aff; padding: 8px 12px;
  background: #1a1b26; border-radius: 8px 8px 0 0; border: 1px solid #2a2b3a; border-bottom: none;
  cursor: pointer; user-select: none; display: flex; justify-content: space-between; align-items: center;
}
.section-title:hover { background: #1e1f2e; }
.section-title .arrow { transition: transform 0.2s; }
.section-title.collapsed .arrow { transform: rotate(-90deg); }
.model-list {
  background: #1a1b26; border: 1px solid #2a2b3a; border-radius: 0 0 8px 8px;
  max-height: 300px; overflow-y: auto;
}
.model-list.hidden { display: none; }
.model-item {
  padding: 8px 12px; font-size: 13px; cursor: pointer; border-bottom: 1px solid #1e1f2e;
  display: flex; justify-content: space-between; align-items: center;
}
.model-item:last-child { border-bottom: none; }
.model-item:hover { background: #1e1f2e; }
.model-item.active { background: #2a2b5a; color: #7c8aff; }
.model-tag {
  font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: 500;
}
.tag-image { background: #1a3a2a; color: #4ade80; }
.tag-video { background: #3a2a1a; color: #fb923c; }

.gen-panel {
  background: #1a1b26; border: 1px solid #2a2b3a; border-radius: 10px; padding: 20px;
}
.gen-panel h3 { font-size: 16px; margin-bottom: 4px; }
.gen-panel .model-info { font-size: 12px; color: #666; margin-bottom: 16px; }

.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: 13px; color: #888; margin-bottom: 6px; }
.form-group textarea, .form-group select {
  width: 100%; background: #0f1117; border: 1px solid #2a2b3a; color: #e1e1e6;
  padding: 10px 12px; border-radius: 8px; font-size: 14px; resize: vertical; min-height: 80px;
  font-family: inherit;
}
.form-group select { min-height: 40px; resize: none; }
.form-group textarea:focus, .form-group select:focus { outline: none; border-color: #7c8aff; }
.param-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.param-grid .form-group { margin-bottom: 0; }
.param-hint { color: #666; font-size: 12px; margin-top: 8px; line-height: 1.5; }

.image-upload-area {
  border: 2px dashed #2a2b3a; border-radius: 8px; padding: 20px; text-align: center;
  cursor: pointer; transition: border-color 0.2s; position: relative;
}
.image-upload-area:hover { border-color: #7c8aff; }
.image-upload-area.has-images { padding: 10px; }
.image-upload-hint { color: #555; font-size: 13px; }
.image-preview-list { display: flex; gap: 8px; flex-wrap: wrap; }
.image-preview-item {
  position: relative; width: 80px; height: 80px; border-radius: 6px; overflow: hidden;
}
.image-preview-item img { width: 100%; height: 100%; object-fit: cover; }
.image-preview-item .remove-btn {
  position: absolute; top: 2px; right: 2px; width: 20px; height: 20px;
  background: rgba(0,0,0,0.7); color: #fff; border: none; border-radius: 50%;
  cursor: pointer; font-size: 12px; display: flex; align-items: center; justify-content: center;
}

.btn-generate {
  width: 100%; padding: 12px; background: #7c8aff; color: #fff; border: none;
  border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer;
  transition: background 0.2s;
}
.btn-generate:hover { background: #6b79ee; }
.btn-generate:disabled { background: #3a3b5a; cursor: not-allowed; }

.output-panel {
  background: #1a1b26; border: 1px solid #2a2b3a; border-radius: 10px; padding: 20px; margin-top: 16px;
}
.output-panel h3 { font-size: 15px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.status-idle { background: #555; }
.status-running { background: #facc15; animation: pulse 1s infinite; }
.status-done { background: #4ade80; }
.status-error { background: #f87171; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

.output-log {
  background: #0f1117; border-radius: 8px; padding: 12px; font-size: 13px;
  line-height: 1.6; max-height: 200px; overflow-y: auto; white-space: pre-wrap;
  word-break: break-all; color: #aaa;
}
.output-result { margin-top: 12px; }
.output-result img { max-width: 100%; border-radius: 8px; margin-top: 8px; }
.output-result video { max-width: 100%; border-radius: 8px; margin-top: 8px; }

.model-list::-webkit-scrollbar, .output-log::-webkit-scrollbar { width: 4px; }
.model-list::-webkit-scrollbar-thumb, .output-log::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }

@media (max-width: 768px) {
  .main-layout { flex-direction: column; }
  .sidebar { width: 100%; }
  .config-bar { flex-wrap: wrap; }
  .param-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="container">
  <h1>🧪 Flow2API 模型测试</h1>
  <p class="subtitle">选择模型，输入提示词，测试生成效果</p>

  <div class="config-bar">
    <label>API Key:</label>
    <input type="password" id="apiKey" placeholder="输入 API Key">
    <label>地址:</label>
    <input type="text" id="baseUrl" placeholder="http://localhost:8000" />
  </div>
  <p class="config-note">未填写 API Key 或模型列表加载失败时，会回退到内置候选模型；实际生成前仍需填写有效 API Key。</p>

  <div class="main-layout">
    <div class="sidebar" id="modelSidebar"></div>
    <div class="content">
      <div class="gen-panel">
        <h3 id="selectedModelName">请选择模型</h3>
        <div class="model-info" id="selectedModelInfo">从左侧列表选择一个模型开始测试</div>

        <div class="form-group">
          <label>提示词 (Prompt)</label>
          <textarea id="promptInput" placeholder="描述你想生成的内容...">一只可爱的橘猫趴在窗台上晒太阳，窗外是樱花盛开的春天</textarea>
        </div>

        <div id="parameterGroup" style="display:none; margin-bottom:14px;">
          <div class="param-grid">
            <div class="form-group" id="aspectParam">
              <label>宽高比</label>
              <select id="aspectSelect"></select>
            </div>
            <div class="form-group" id="durationParam">
              <label>时长</label>
              <select id="durationSelect"></select>
            </div>
            <div class="form-group" id="imageSizeParam">
              <label>图片清晰度</label>
              <select id="imageSizeSelect"></select>
            </div>
            <div class="form-group" id="resolutionParam">
              <label>视频输出</label>
              <select id="resolutionSelect"></select>
            </div>
          </div>
          <div class="param-hint" id="parameterHint"></div>
        </div>

        <div class="form-group" id="imageUploadGroup" style="display:none;">
          <label>上传图片 <span id="imageLimit" style="color:#666;font-size:12px;"></span></label>
          <div class="image-upload-area" id="imageUploadArea">
            <div class="image-upload-hint" id="imageHint">点击或拖拽上传图片</div>
            <div class="image-preview-list" id="imagePreviewList"></div>
          </div>
          <input type="file" id="imageFileInput" accept="image/*" multiple style="display:none;">
        </div>

        <button class="btn-generate" id="btnGenerate" disabled>选择模型后开始生成</button>
      </div>

      <div class="output-panel">
        <h3><span class="status-dot status-idle" id="statusDot"></span> <span id="statusText">等待中</span></h3>
        <div class="output-log" id="outputLog">准备就绪，选择模型并点击生成按钮开始...</div>
        <div class="output-result" id="outputResult"></div>
      </div>
    </div>
  </div>
</div>

<script>
const STATE = { selectedModel: null, modelConfig: null, images: [], generating: false };

const ASPECT_LABELS = {
  landscape: "16:9 横屏",
  portrait: "9:16 竖屏",
  square: "1:1 方图",
  "four-three": "4:3 横图",
  "three-four": "3:4 竖图",
};

const MODEL_CATEGORIES = [
  { name: "参数自动选择 Alias", filter: item => item.is_alias },
  { name: "Gemini Omni Flash R2V", filter: item => item.id.startsWith("gemini-omni-flash") },
  { name: "Gemini 3.1 Flash 图片", filter: item => item.id.startsWith("gemini-3.1-flash-image") },
  { name: "Gemini 3.0 Pro 图片", filter: item => item.id.startsWith("gemini-3.0-pro-image") },
  { name: "Imagen 4.0 图片", filter: item => item.id.startsWith("imagen-4.0") },
  { name: "Veo 3.1 文生视频 (T2V)", filter: item => item.video_type === "t2v" && !hasUpsample(item) },
  { name: "Veo 3.1 图生视频 (I2V)", filter: item => item.video_type === "i2v" && !item.id.includes("interpolation") && !hasUpsample(item) },
  { name: "Veo 3.1 插帧视频", filter: item => item.id.includes("interpolation") && !hasUpsample(item) },
  { name: "Veo 3.1 多图视频 (R2V)", filter: item => item.video_type === "r2v" && !item.id.startsWith("gemini-omni-flash") && !hasUpsample(item) },
  { name: "Veo 3.1 视频续写", filter: item => item.video_type === "extend" },
  { name: "视频放大 (Upsample)", filter: item => hasUpsample(item) },
  { name: "其他模型", filter: () => true },
];

function fallbackItem(id, description, meta) {
  return {
    id,
    description,
    is_alias: Boolean(meta.is_alias),
    type: meta.type || "video",
    video_type: meta.video_type,
    supports_images: Boolean(meta.supports_images),
    min_images: meta.min_images ?? null,
    max_images: meta.max_images ?? null,
    aspects: meta.aspects || [],
    durations: meta.durations || [],
    sizes: meta.sizes || [],
    resolutions: meta.resolutions || [],
    requires_video_id: Boolean(meta.requires_video_id),
  };
}

const FALLBACK_MODELS = [
  fallbackItem("gemini-3.1-flash-image", "Image generation (alias) - aspects and sizes via generationConfig", { type: "image", is_alias: true, supports_images: true, min_images: 0, max_images: 5, aspects: ["landscape", "portrait", "square", "four-three", "three-four"], sizes: ["2k", "4k"] }),
  fallbackItem("gemini-3.0-pro-image", "Image generation (alias) - aspects and sizes via generationConfig", { type: "image", is_alias: true, supports_images: true, min_images: 0, max_images: 5, aspects: ["landscape", "portrait", "square", "four-three", "three-four"], sizes: ["2k", "4k"] }),
  fallbackItem("imagen-4.0-generate-preview", "Image generation (alias) - landscape/portrait", { type: "image", is_alias: true, supports_images: true, min_images: 0, max_images: 5, aspects: ["landscape", "portrait"] }),
  fallbackItem("gemini-omni-flash", "Video generation (alias) - Omni Flash R2V with optional references", { type: "video", video_type: "r2v", is_alias: true, supports_images: true, min_images: 0, max_images: 3, aspects: ["landscape", "portrait"], durations: [4, 6, 8, 10] }),
  fallbackItem("veo_3_1_t2v", "Video generation (alias) - quality T2V", { type: "video", video_type: "t2v", is_alias: true, aspects: ["landscape", "portrait"], durations: [4, 6], resolutions: ["1080p", "4k"] }),
  fallbackItem("veo_3_1_t2v_fast", "Video generation (alias) - fast T2V", { type: "video", video_type: "t2v", is_alias: true, aspects: ["landscape", "portrait"], durations: [4, 6], resolutions: ["1080p", "4k"] }),
  fallbackItem("veo_3_1_i2v_s", "Video generation (alias) - quality I2V", { type: "video", video_type: "i2v", is_alias: true, supports_images: true, min_images: 1, max_images: 2, aspects: ["landscape", "portrait"], durations: [4, 6], resolutions: ["1080p", "4k"] }),
  fallbackItem("veo_3_1_i2v_lite", "Video generation (alias) - lite I2V", { type: "video", video_type: "i2v", is_alias: true, supports_images: true, min_images: 1, max_images: 1, aspects: ["landscape", "portrait"], durations: [4, 6] }),
  fallbackItem("veo_3_1_interpolation_lite", "Video generation (alias) - interpolation lite", { type: "video", video_type: "i2v", is_alias: true, supports_images: true, min_images: 2, max_images: 2, aspects: ["landscape", "portrait"], durations: [4, 6] }),
  fallbackItem("veo_3_1_r2v_fast", "Video generation (alias) - R2V fast", { type: "video", video_type: "r2v", is_alias: true, supports_images: true, min_images: 0, max_images: 3, aspects: ["landscape", "portrait"] }),
  fallbackItem("veo_3_1_r2v_fast_ultra", "Video generation (alias) - R2V ultra", { type: "video", video_type: "r2v", is_alias: true, supports_images: true, min_images: 0, max_images: 3, aspects: ["landscape", "portrait"], resolutions: ["1080p", "4k"] }),
  fallbackItem("veo_3_1_extend", "Video generation (alias) - extend generated video", { type: "video", video_type: "extend", is_alias: true, requires_video_id: true, aspects: ["landscape", "portrait"] }),
];

let ALL_MODELS = {};

function applyFallbackModels(reason) {
  console.warn("使用内置候选模型列表:", reason);
  ALL_MODELS = {};
  FALLBACK_MODELS.forEach(item => { ALL_MODELS[item.id] = item; });
  renderSidebar();
}

function hasUpsample(item) {
  return Boolean(item.upsample) || item.id.includes("4k") || item.id.includes("1080p");
}

function normalizeModelItem(item) {
  const id = item.id || item.name || "";
  const isImage = item.type === "image" || id.includes("image") || id.startsWith("imagen");
  return {
    id,
    description: item.description || "",
    is_alias: Boolean(item.is_alias),
    type: item.type || (isImage ? "image" : "video"),
    video_type: item.video_type || null,
    model_key: item.model_key || null,
    aspect_ratio: item.aspect_ratio || null,
    supports_images: Boolean(item.supports_images ?? isImage),
    min_images: item.min_images ?? (isImage ? 0 : null),
    max_images: item.max_images ?? (isImage ? 5 : null),
    aspects: item.aspects || [],
    durations: item.durations || [],
    sizes: item.sizes || [],
    resolutions: item.resolutions || [],
    upsample: item.upsample || null,
    requires_video_id: Boolean(item.requires_video_id),
    default_model: item.default_model || null,
  };
}

async function loadModels() {
  const baseUrl = (document.getElementById("baseUrl").value || "").trim();
  const apiKey = (document.getElementById("apiKey").value || "").trim();
  if (!baseUrl || !apiKey) {
    applyFallbackModels("missing_base_url_or_api_key");
    return;
  }
  try {
    const resp = await fetch(`${baseUrl}/v1/models`, {
      headers: { "Authorization": `Bearer ${apiKey}` }
    });
    if (!resp.ok) {
      throw new Error(`HTTP ${resp.status}`);
    }
    const data = await resp.json();
    const items = Array.isArray(data.data) ? data.data : [];
    if (!items.length) {
      applyFallbackModels("empty_model_catalog");
      return;
    }
    ALL_MODELS = {};
    items.forEach(m => {
      const item = normalizeModelItem(m);
      ALL_MODELS[item.id] = item;
    });

    try {
      const aliasResp = await fetch(`${baseUrl}/v1/models/aliases`, {
        headers: { "Authorization": `Bearer ${apiKey}` }
      });
      if (aliasResp.ok) {
        const aliasData = await aliasResp.json();
        const aliases = Array.isArray(aliasData.data) ? aliasData.data : [];
        aliases.forEach(m => {
          const item = normalizeModelItem(m);
          ALL_MODELS[item.id] = item;
        });
      }
    } catch (e) {
      console.warn("加载别名模型失败，仅显示具体模型:", e);
    }

    renderSidebar();
  } catch (e) {
    console.error("加载模型失败:", e);
    applyFallbackModels(e.message || "load_failed");
  }
}

function renderSidebarFallback() {
  applyFallbackModels("legacy_fallback");
}

function getModelType(modelId) {
  const item = ALL_MODELS[modelId];
  if (item && item.type) return item.type;
  if (modelId.includes("image") || modelId.startsWith("imagen")) return "image";
  return "video";
}

function getModelMeta(modelId) {
  const item = ALL_MODELS[modelId] || normalizeModelItem({ id: modelId });
  return {
    ...item,
    supportsImages: Boolean(item.supports_images),
    minImages: item.min_images ?? 0,
    maxImages: item.max_images ?? 0,
  };
}

function renderSidebar() {
  const sidebar = document.getElementById("modelSidebar");
  sidebar.innerHTML = "";

  const models = Object.values(ALL_MODELS).sort((a, b) => a.id.localeCompare(b.id));
  if (models.length === 0) {
    sidebar.innerHTML = '<div class="model-section"><div class="model-list" style="border-radius:8px;"><div class="model-item" style="cursor:default;color:#888;">未获取到可用模型，请检查 API Key 或稍后重试</div></div></div>';
    return;
  }

  const rendered = new Set();
  MODEL_CATEGORIES.forEach(catDef => {
    const sectionModels = models.filter(item => !rendered.has(item.id) && catDef.filter(item));
    if (sectionModels.length === 0) return;
    sectionModels.forEach(item => rendered.add(item.id));

    const section = document.createElement("div");
    section.className = "model-section";

    const title = document.createElement("div");
    title.className = "section-title";
    title.innerHTML = `<span>${catDef.name} (${sectionModels.length})</span><span class="arrow">▼</span>`;

    const list = document.createElement("div");
    list.className = "model-list";

    sectionModels.forEach(model => {
      const item = document.createElement("div");
      item.className = "model-item";
      item.dataset.model = model.id;

      const type = getModelType(model.id);
      const shortName = model.id
        .replace("gemini-3.1-flash-image-", "")
        .replace("gemini-3.0-pro-image-", "")
        .replace("imagen-4.0-generate-preview-", "");
      const tag = model.is_alias ? "Alias" : (type === "image" ? "图片" : "视频");
      item.innerHTML = `<span>${shortName}</span><span class="model-tag ${type === 'image' ? 'tag-image' : 'tag-video'}">${tag}</span>`;
      item.onclick = () => selectModel(model.id);
      list.appendChild(item);
    });

    title.onclick = () => {
      title.classList.toggle("collapsed");
      list.classList.toggle("hidden");
    };

    section.appendChild(title);
    section.appendChild(list);
    sidebar.appendChild(section);
  });
}

function setSelectOptions(selectId, values, labels, includeDefault) {
  const select = document.getElementById(selectId);
  select.innerHTML = "";
  if (includeDefault) {
    const option = document.createElement("option");
    option.value = "";
    option.textContent = "默认";
    select.appendChild(option);
  }
  values.forEach(value => {
    const option = document.createElement("option");
    option.value = value;
    option.textContent = labels[value] || value;
    select.appendChild(option);
  });
}

function toggleParam(id, visible) {
  document.getElementById(id).style.display = visible ? "block" : "none";
}

function updateParameterControls(meta) {
  const group = document.getElementById("parameterGroup");
  const showAliasControls = Boolean(meta.is_alias);
  const aspects = meta.aspects || [];
  const durations = meta.durations || [];
  const sizes = meta.sizes || [];
  const resolutions = meta.resolutions || [];

  toggleParam("aspectParam", showAliasControls && aspects.length > 0);
  toggleParam("durationParam", showAliasControls && durations.length > 0);
  toggleParam("imageSizeParam", showAliasControls && meta.type === "image" && sizes.length > 0);
  toggleParam("resolutionParam", showAliasControls && meta.type === "video" && resolutions.length > 0);

  if (showAliasControls && aspects.length) setSelectOptions("aspectSelect", aspects, ASPECT_LABELS, true);
  if (showAliasControls && durations.length) setSelectOptions("durationSelect", durations.map(String), {}, true);
  if (showAliasControls && sizes.length) setSelectOptions("imageSizeSelect", sizes, {}, true);
  if (showAliasControls && resolutions.length) setSelectOptions("resolutionSelect", resolutions, { "1080p": "1080P", "4k": "4K" }, true);

  const visible = showAliasControls && (aspects.length || durations.length || sizes.length || resolutions.length);
  group.style.display = visible ? "block" : "none";
  document.getElementById("parameterHint").textContent = visible
    ? "选择 alias 时，这些参数会随请求发送到 generationConfig，由服务端解析到具体模型变体。"
    : "";
}

function selectModel(modelId) {
  STATE.selectedModel = modelId;
  STATE.modelConfig = getModelMeta(modelId);
  STATE.images = [];

  // Update sidebar active state
  document.querySelectorAll(".model-item").forEach(el => {
    el.classList.toggle("active", el.dataset.model === modelId);
  });

  // Update panel
  document.getElementById("selectedModelName").textContent = modelId;
  document.getElementById("selectedModelInfo").textContent = STATE.modelConfig.description || "";
  updateParameterControls(STATE.modelConfig);

  // Show/hide image upload
  const uploadGroup = document.getElementById("imageUploadGroup");
  const meta = STATE.modelConfig;
  if (meta.supportsImages) {
    uploadGroup.style.display = "block";
    const limitText = meta.type === "image" ? "可选，用于图生图" : `${meta.minImages}-${meta.maxImages}张`;
    document.getElementById("imageLimit").textContent = `(${limitText})`;
  } else {
    uploadGroup.style.display = "none";
  }

  // Reset image previews
  document.getElementById("imagePreviewList").innerHTML = "";
  document.getElementById("imageHint").style.display = "block";

  // Enable button
  const btn = document.getElementById("btnGenerate");
  btn.disabled = false;
  btn.textContent = meta.type === "image" ? "🎨 生成图片" : "🎬 生成视频";
}

// Image upload handling
const uploadArea = document.getElementById("imageUploadArea");
const fileInput = document.getElementById("imageFileInput");

uploadArea.onclick = (e) => {
  if (e.target.closest(".remove-btn")) return;
  fileInput.click();
};

uploadArea.ondragover = (e) => { e.preventDefault(); uploadArea.style.borderColor = "#7c8aff"; };
uploadArea.ondragleave = () => { uploadArea.style.borderColor = "#2a2b3a"; };
uploadArea.ondrop = (e) => {
  e.preventDefault();
  uploadArea.style.borderColor = "#2a2b3a";
  handleFiles(e.dataTransfer.files);
};

fileInput.onchange = () => { handleFiles(fileInput.files); fileInput.value = ""; };

function handleFiles(files) {
  const maxImages = STATE.modelConfig ? STATE.modelConfig.maxImages : 5;
  for (const file of files) {
    if (STATE.images.length >= maxImages) break;
    if (!file.type.startsWith("image/")) continue;

    const reader = new FileReader();
    reader.onload = (e) => {
      STATE.images.push(e.target.result);
      renderImagePreviews();
    };
    reader.readAsDataURL(file);
  }
}

function renderImagePreviews() {
  const list = document.getElementById("imagePreviewList");
  const hint = document.getElementById("imageHint");
  list.innerHTML = "";
  hint.style.display = STATE.images.length ? "none" : "block";

  STATE.images.forEach((dataUrl, idx) => {
    const item = document.createElement("div");
    item.className = "image-preview-item";
    item.innerHTML = `<img src="${dataUrl}" alt="preview"><button class="remove-btn" onclick="removeImage(${idx})">×</button>`;
    list.appendChild(item);
  });
}

function removeImage(idx) {
  STATE.images.splice(idx, 1);
  renderImagePreviews();
}

function buildGenerationConfig() {
  const meta = STATE.modelConfig || {};
  if (!meta.is_alias) return null;

  const generationConfig = {};
  const aspect = document.getElementById("aspectSelect").value;
  const duration = document.getElementById("durationSelect").value;
  const imageSize = document.getElementById("imageSizeSelect").value;
  const resolution = document.getElementById("resolutionSelect").value;

  if (aspect) generationConfig.aspectRatio = aspect;
  if (duration) generationConfig.duration = Number(duration);
  if (meta.type === "image" && imageSize) {
    generationConfig.imageConfig = { imageSize };
    if (aspect) generationConfig.imageConfig.aspectRatio = aspect;
  }
  if (meta.type === "video" && resolution) generationConfig.resolution = resolution;

  return Object.keys(generationConfig).length ? generationConfig : null;
}

// Generation
document.getElementById("btnGenerate").onclick = generate;

async function generate() {
  if (!STATE.selectedModel || STATE.generating) return;

  const baseUrl = (document.getElementById("baseUrl").value || "").trim();
  const apiKey = (document.getElementById("apiKey").value || "").trim();
  const prompt = document.getElementById("promptInput").value.trim();
  if (!prompt) { alert("请输入提示词"); return; }
  if (!apiKey) { alert("请输入 API Key"); return; }
  if (!baseUrl) { alert("请输入服务地址"); return; }
  const meta = STATE.modelConfig || {};
  if (meta.requires_video_id) {
    alert("当前测试页暂不支持视频续写所需的源视频 ID，请使用 API 直接测试该模型。");
    return;
  }
  if (STATE.images.length < (meta.minImages || 0)) {
    alert(`当前模型至少需要 ${meta.minImages} 张图片`);
    return;
  }

  STATE.generating = true;
  const btn = document.getElementById("btnGenerate");
  btn.disabled = true;
  btn.textContent = "⏳ 生成中...";

  const dot = document.getElementById("statusDot");
  dot.className = "status-dot status-running";
  document.getElementById("statusText").textContent = "生成中...";
  document.getElementById("outputLog").textContent = "";
  document.getElementById("outputResult").innerHTML = "";

  const log = document.getElementById("outputLog");
  const appendLog = (text) => { log.textContent += text; log.scrollTop = log.scrollHeight; };

  // Build messages
  const content = [];
  content.push({ type: "text", text: prompt });
  STATE.images.forEach(dataUrl => {
    content.push({ type: "image_url", image_url: { url: dataUrl } });
  });

  const messages = [{ role: "user", content: content.length === 1 ? prompt : content }];

  const body = { model: STATE.selectedModel, messages, stream: true };
  const generationConfig = buildGenerationConfig();
  if (generationConfig) body.generationConfig = generationConfig;

  const startTime = Date.now();
  appendLog(`[${new Date().toLocaleTimeString()}] 模型: ${STATE.selectedModel}\n`);
  if (generationConfig) appendLog(`[${new Date().toLocaleTimeString()}] 参数: ${JSON.stringify(generationConfig)}\n`);
  appendLog(`[${new Date().toLocaleTimeString()}] 提示词: ${prompt.substring(0, 100)}${prompt.length > 100 ? '...' : ''}\n`);
  appendLog(`[${new Date().toLocaleTimeString()}] 开始请求...\n`);

  try {
    const resp = await fetch(`${baseUrl}/v1/chat/completions`, {
      method: "POST",
      headers: { "Authorization": `Bearer ${apiKey}`, "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });

    if (!resp.ok) {
      const errText = await resp.text();
      throw new Error(`HTTP ${resp.status}: ${errText}`);
    }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let fullContent = "";
    let buffer = "";

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split("\n");
      buffer = lines.pop() || "";

      for (const line of lines) {
        if (!line.startsWith("data: ")) continue;
        const data = line.slice(6).trim();
        if (data === "[DONE]") continue;

        try {
          const parsed = JSON.parse(data);
          if (parsed.error) {
            appendLog(`\n❌ 错误: ${JSON.stringify(parsed.error)}\n`);
            continue;
          }
          const choices = parsed.choices || [];
          if (choices.length > 0) {
            const delta = choices[0].delta || {};
            const content = delta.reasoning_content || delta.content || "";
            if (content) {
              fullContent += content;
              appendLog(content);
            }
          }
        } catch (e) {
          // skip unparseable chunks
        }
      }
    }

    const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
    appendLog(`\n\n[${new Date().toLocaleTimeString()}] 完成，耗时 ${elapsed}s\n`);

    // Render result
    renderResult(fullContent);
    dot.className = "status-dot status-done";
    document.getElementById("statusText").textContent = `完成 (${elapsed}s)`;

  } catch (e) {
    appendLog(`\n❌ 请求失败: ${e.message}\n`);
    dot.className = "status-dot status-error";
    document.getElementById("statusText").textContent = "失败";
  } finally {
    STATE.generating = false;
    btn.disabled = false;
    const meta = STATE.modelConfig;
    btn.textContent = meta && meta.type === "image" ? "🎨 生成图片" : "🎬 生成视频";
  }
}

function renderResult(content) {
  const resultDiv = document.getElementById("outputResult");
  resultDiv.innerHTML = "";

  // Extract markdown images
  const imgRegex = /!\[.*?\]\((.*?)\)/g;
  let match;
  while ((match = imgRegex.exec(content)) !== null) {
    const img = document.createElement("img");
    img.src = match[1];
    img.alt = "生成结果";
    img.loading = "lazy";
    resultDiv.appendChild(img);
  }

  // Extract video tags
  const videoRegex = /<video[^>]+src=['"]([^'"]+)['"]/gi;
  while ((match = videoRegex.exec(content)) !== null) {
    const video = document.createElement("video");
    video.src = match[1];
    video.controls = true;
    video.autoplay = true;
    video.loop = true;
    resultDiv.appendChild(video);
  }

  // If no media found, show raw text
  if (resultDiv.children.length === 0 && content.trim()) {
    const pre = document.createElement("pre");
    pre.style.cssText = "color:#aaa;font-size:13px;white-space:pre-wrap;word-break:break-all;";
    pre.textContent = content;
    resultDiv.appendChild(pre);
  }
}

// Auto-detect base URL
(function() {
  const baseUrlInput = document.getElementById("baseUrl");
  const apiKeyInput = document.getElementById("apiKey");
  baseUrlInput.value = window.location.origin;
  baseUrlInput.addEventListener("change", loadModels);
  apiKeyInput.addEventListener("change", loadModels);
  loadModels();
})();
</script>
</body>
</html>
